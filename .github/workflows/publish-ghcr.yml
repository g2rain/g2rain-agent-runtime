name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Verify and publish release image
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure GitHub Maven dependency repositories
        shell: bash
        run: |
          set -euo pipefail
          settings_path="${RUNNER_TEMP}/g2rain-maven-settings.xml"
          python3 - "$settings_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.Element('settings', xmlns='http://maven.apache.org/SETTINGS/1.0.0')
          servers = ET.SubElement(root, 'servers')
          profile = ET.SubElement(ET.SubElement(root, 'profiles'), 'profile')
          ET.SubElement(profile, 'id').text = 'g2rain-packages'
          repositories = ET.SubElement(profile, 'repositories')
          for name in ('g2rain-agent-studio', 'g2rain-model-nexus', 'g2rain-infra'):
              server = ET.SubElement(servers, 'server')
              for key, value in [('id', name), ('username', '${env.GITHUB_ACTOR}'), ('password', '${env.GITHUB_TOKEN}')]:
                  ET.SubElement(server, key).text = value
              repository = ET.SubElement(repositories, 'repository')
              ET.SubElement(repository, 'id').text = name
              ET.SubElement(repository, 'url').text = 'https://maven.pkg.github.com/g2rain/' + name
              ET.SubElement(ET.SubElement(repository, 'snapshots'), 'enabled').text = 'false'
          ET.SubElement(ET.SubElement(root, 'activeProfiles'), 'activeProfile').text = 'g2rain-packages'
          ET.ElementTree(root).write(sys.argv[1], encoding='utf-8', xml_declaration=True)
          PY
          chmod 600 "$settings_path"
          echo "MAVEN_SETTINGS=$settings_path" >> "$GITHUB_ENV"
          echo 'Configured authenticated Maven repositories: agent-studio, model-nexus, infra.'

      - name: Validate release tag, branch, notes, and project version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable release tag: ${TAG_NAME}" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          RELEASE_COMMIT="$(git rev-list -n 1 "${GITHUB_REF}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main; then
            echo "Release tag ${TAG_NAME} (${RELEASE_COMMIT}) is not contained in origin/main." >&2
            exit 1
          fi

          RELEASE_NOTE="docs/releases/v${VERSION}.md"
          if ! git cat-file -e "${RELEASE_COMMIT}:${RELEASE_NOTE}" 2>/dev/null || \
              [[ -z "$(git show "${RELEASE_COMMIT}:${RELEASE_NOTE}" | tr -d '[:space:]')" ]]; then
            echo "Missing or empty release note at ${RELEASE_NOTE} in the tagged commit." >&2
            exit 1
          fi

          PROJECT_VERSION="$(mvn --settings "$MAVEN_SETTINGS" --batch-mode --quiet -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${TAG_NAME} does not match Maven project version ${PROJECT_VERSION}." >&2
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "commit=${RELEASE_COMMIT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and test all modules
        run: mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -U clean install

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both immutable release tags with Jib
        working-directory: g2rain-agent-runtime-startup
        env:
          IMAGE_NAME: ghcr.io/g2rain/g2rain-agent-runtime
          IMAGE_TAG: ${{ steps.release.outputs.version }}
          EXTRA_TAGS: sha-${{ steps.release.outputs.commit }}
        run: |
          args=()
          if [[ -n "$EXTRA_TAGS" ]]; then
            args+=("-Djib.to.tags=$EXTRA_TAGS")
          fi
          mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -DskipTests=true compile jib:build \
            "-Djib.to.image=$IMAGE_NAME:$IMAGE_TAG" \
            "${args[@]}"

      - name: Report successful publication
        env:
          IMAGE: ghcr.io/g2rain/g2rain-agent-runtime
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          {
            echo "## GHCR publication succeeded"
            echo
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- \`${IMAGE}:sha-${RELEASE_COMMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-api:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-maven.yml
