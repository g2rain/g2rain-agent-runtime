<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="2080" viewBox="0 0 2560 2080">
<rect width="100%" height="100%" fill="#F5F7FB"/>
<text x="82.0" y="105" font-family="Microsoft YaHei, sans-serif" font-size="60" font-weight="700" fill="#24354B">g2rain  ×  pi-py</text>
<text x="84.0" y="165" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#527CC2">业务能力编排服务，与可嵌入 Agent SDK 的架构对比</text>
<text x="2234.0" y="94" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#6B7A90">代码视角 · 2026-10-05</text>
<text x="2129.0" y="135" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#6B7A90">pi-py: encyc/pi-py @ 978448fe3fa1</text>
<text x="84.0" y="224" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#6B7A90">比较核心抽象与扩展边界；文件与 CLI 工具不作为 g2rain 的能力要求。</text>
<rect x="60" y="265" width="1185" height="1120" rx="24" fill="#FFFFFF" stroke="#D8E3F1" stroke-width="2"/>
<rect x="1315" y="265" width="1185" height="1120" rx="24" fill="#FFFFFF" stroke="#DADFF0" stroke-width="2"/>
<text x="100.0" y="331" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#355E95">g2rain-agent-runtime</text>
<text x="100.0" y="375" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#617792">定义业务语义，再组织模型与 MCP 执行</text>
<text x="1355.0" y="331" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#76549B">pi-agent-core  +  pi-ai</text>
<text x="1355.0" y="375" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#776B8A">提供通用循环，业务策略交给宿主组合</text>
<rect x="110" y="417" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="111" y="418" width="7" height="131" rx="3" fill="#527CC2" stroke="#527CC2" stroke-width="1"/>
<text x="132.0" y="459" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#527CC2">能力定义：Agent / Skill / SkillContract</text>
<text x="132.0" y="493" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">Agent 是能力画像；Skill 是可执行的业务动作</text>
<text x="132.0" y="525" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">定义工具集合、输入输出、来源与完成条件</text>
<rect x="1365" y="417" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="1366" y="418" width="7" height="131" rx="3" fill="#8D6BB0" stroke="#8D6BB0" stroke-width="1"/>
<text x="1387.0" y="459" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#8D6BB0">宿主装配：AgentOptions / AgentTool</text>
<text x="1387.0" y="493" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">Agent 是有状态运行实例；宿主注入工具、模型与钩子</text>
<text x="1387.0" y="525" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">harness Skill 提供描述与指令内容，不定义业务契约</text>
<rect x="110" y="614" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="111" y="615" width="7" height="131" rx="3" fill="#527CC2" stroke="#527CC2" stroke-width="1"/>
<text x="132.0" y="656" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#527CC2">外层编排：DefaultTurnPipeline / TaskGraph</text>
<text x="132.0" y="690" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">选择 Agent → 装载 Skill → 规划业务依赖 → 推进节点</text>
<text x="132.0" y="722" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">节点有状态、正式输出、人工断点及 Skill 前置委派</text>
<rect x="1365" y="614" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="1366" y="615" width="7" height="131" rx="3" fill="#8D6BB0" stroke="#8D6BB0" stroke-width="1"/>
<text x="1387.0" y="656" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#8D6BB0">实例封装：Agent / AgentState</text>
<text x="1387.0" y="690" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">管理消息、工具、运行状态与事件订阅</text>
<text x="1387.0" y="722" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">steering / follow-up 为循环提供后续输入</text>
<polyline points="652,550 652,614" fill="none" stroke="#527CC2" stroke-width="3"/><polygon points="652.0,614.0 645.9,601.4 658.1,601.4" fill="#527CC2"/>
<polyline points="1907,550 1907,614" fill="none" stroke="#8D6BB0" stroke-width="3"/><polygon points="1907.0,614.0 1900.9,601.4 1913.1,601.4" fill="#8D6BB0"/>
<rect x="110" y="811" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="111" y="812" width="7" height="131" rx="3" fill="#278676" stroke="#278676" stroke-width="1"/>
<text x="132.0" y="853" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#278676">节点执行：DefaultReActLoop</text>
<text x="132.0" y="887" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">状态投影 → 模型判断 → 工具调用 → 观测 → 继续</text>
<text x="132.0" y="919" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">完成需经过内置 finish 与业务契约验收</text>
<rect x="1365" y="811" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="1366" y="812" width="7" height="131" rx="3" fill="#278676" stroke="#278676" stroke-width="1"/>
<text x="1387.0" y="853" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#278676">执行内核：agent_loop / agent_loop_continue</text>
<text x="1387.0" y="887" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">消息上下文 → 流式模型 → 工具调用 → 结果消息 → 继续</text>
<text x="1387.0" y="919" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">默认无工具调用且无排队输入时结束；宿主可设停止钩子</text>
<polyline points="652,747 652,811" fill="none" stroke="#527CC2" stroke-width="3"/><polygon points="652.0,811.0 645.9,798.4 658.1,798.4" fill="#527CC2"/>
<polyline points="1907,747 1907,811" fill="none" stroke="#8D6BB0" stroke-width="3"/><polygon points="1907.0,811.0 1900.9,798.4 1913.1,798.4" fill="#8D6BB0"/>
<polyline points="1195,877 1365,877" fill="none" stroke="#278676" stroke-width="3" stroke-dasharray="9 7"/><polygon points="1365.0,877.0 1352.4,883.1 1352.4,870.9" fill="#278676"/>
<rect x="1237.5" y="840" width="85.0" height="31" rx="6" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1"/>
<text x="1248.5" y="863" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#278676">对应层</text>
<rect x="110" y="1008" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="111" y="1009" width="7" height="131" rx="3" fill="#527CC2" stroke="#527CC2" stroke-width="1"/>
<text x="132.0" y="1050" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#527CC2">工具与模型边界</text>
<text x="132.0" y="1084" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">ToolInvoker + 拦截链 → MCP / 内置控制工具</text>
<text x="132.0" y="1116" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">ModelGateway → Model Nexus；MCP → Registry</text>
<rect x="1365" y="1008" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="1366" y="1009" width="7" height="131" rx="3" fill="#8D6BB0" stroke="#8D6BB0" stroke-width="1"/>
<text x="1387.0" y="1050" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#8D6BB0">工具与模型边界</text>
<text x="1387.0" y="1084" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">AgentTool.execute + before / after 钩子；工具批次可并行</text>
<text x="1387.0" y="1116" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">stream_fn / pi-ai provider 注册；MCP 需宿主实现适配</text>
<polyline points="652,944 652,1008" fill="none" stroke="#527CC2" stroke-width="3"/><polygon points="652.0,1008.0 645.9,995.4 658.1,995.4" fill="#527CC2"/>
<polyline points="1907,944 1907,1008" fill="none" stroke="#8D6BB0" stroke-width="3"/><polygon points="1907.0,1008.0 1900.9,995.4 1913.1,995.4" fill="#8D6BB0"/>
<rect x="110" y="1205" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="111" y="1206" width="7" height="131" rx="3" fill="#B58B42" stroke="#B58B42" stroke-width="1"/>
<text x="132.0" y="1247" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#B58B42">业务状态：TurnScope / NodeScope</text>
<text x="132.0" y="1281" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">任务图、断点、带来源输出、证据、共享值与实体记忆</text>
<text x="132.0" y="1313" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">业务事实支持下一节点；Redis / MySQL 是平台适配</text>
<rect x="1365" y="1205" width="1085" height="133" rx="16" fill="#FFFFFF" stroke="#CCD8E7" stroke-width="2"/>
<rect x="1366" y="1206" width="7" height="131" rx="3" fill="#B58B42" stroke="#B58B42" stroke-width="1"/>
<text x="1387.0" y="1247" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#B58B42">上下文能力：Session / SessionStorage / compaction</text>
<text x="1387.0" y="1281" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">对话条目树、分支、存储与摘要压缩，供宿主装配使用</text>
<text x="1387.0" y="1313" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#596C84">对话历史树不承担业务依赖图的调度职责</text>
<polyline points="652,1141 652,1205" fill="none" stroke="#527CC2" stroke-width="3"/><polygon points="652.0,1205.0 645.9,1192.4 658.1,1192.4" fill="#527CC2"/>
<polyline points="1907,1141 1907,1205" fill="none" stroke="#8D6BB0" stroke-width="3"/><polygon points="1907.0,1205.0 1900.9,1192.4 1913.1,1192.4" fill="#8D6BB0"/>
<rect x="60" y="1430" width="2440" height="155" rx="20" fill="#EDF7F2" stroke="#BCD8CB" stroke-width="2"/>
<text x="96.0" y="1483" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#2C6959">最接近的比较层</text>
<text x="96.0" y="1530" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#2C6959">DefaultReActLoop  ≈  agent_loop；g2rain 的 Task / Skill 契约 / 图编排，是它额外定义的业务执行层。</text>
<text x="96.0" y="1567" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#517665">pi-py 的 SDK 包边界更便于嵌入；g2rain 的业务语义更完整，现有 SaaS 任务接入更直接。</text>
<rect x="60" y="1630" width="2440" height="328" rx="20" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="2"/>
<text x="96.0" y="1688" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#24354B">通用性与适用性</text>
<rect x="82" y="1717" width="2395" height="48" rx="6" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1"/>
<text x="98.0" y="1743" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#24354B">业务领域扩展</text>
<text x="365.0" y="1743" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#355E95">g2rain：Skill + 契约 + MCP，主要扩展能力定义</text>
<text x="1450.0" y="1742" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#76549B">pi-py：工具 + 提示 + 宿主策略，主要扩展代码组合</text>
<text x="98.0" y="1794" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#24354B">运行内核复用</text>
<text x="365.0" y="1794" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#355E95">g2rain：较深地绑定平台类型与业务状态</text>
<text x="1450.0" y="1793" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#76549B">pi-py：独立循环与可注入边界，SDK 复用较强</text>
<rect x="82" y="1819" width="2395" height="48" rx="6" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1"/>
<text x="98.0" y="1845" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#24354B">任务执行语义</text>
<text x="365.0" y="1845" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#355E95">g2rain：业务节点、验收、人工断点是一等对象</text>
<text x="1450.0" y="1844" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#76549B">pi-py：保持通用，业务流程与验收由宿主建立</text>
<text x="98.0" y="1896" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#24354B">适配场景</text>
<text x="365.0" y="1896" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#355E95">企业数字员工 · MCP 业务操作 · 受约束能力组合</text>
<text x="1450.0" y="1895" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#76549B">定制 Agent 产品 · 开放任务 · 通用运行内核嵌入</text>
<text x="82.0" y="2022" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#24354B">边界提示</text>
<text x="245.0" y="2023" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#61738C">工具批次并行 ≠ 业务图并行；会话分支 ≠ 工作流分支；多个实例 ≠ 多 Agent 协作。</text>
<text x="82.0" y="2062" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#7C8899">事实来自两份代码快照；此图不代表性能、模型效果或生产稳定性的测试结论。</text>
</svg>